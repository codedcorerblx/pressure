<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta id="meta-description" name="description" content="Welcome to what I called PMS, Pressure Modifiers Selector. Here you can share modifiers with other after selecting too!">
<meta id="og-title" property="og:title" content="Pressure Modifiers Selector">
<meta id="og-description" property="og:description" content="Welcome to what I called PMS, Pressure Modifiers Selector. Here you can share modifiers with other after selecting too!">
<meta id="twitter-description" name="twitter:description" content="Welcome to what I called PMS, Pressure Modifiers Selector. Here you can share modifiers with other after selecting too!">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modifier Console</title>
<script>
  // Applies the saved theme before first paint, so there's no flash of
  // the default theme on load. Best-effort — falls through silently if
  // localStorage is unavailable.
  (function () {
    try {
      var theme = localStorage.getItem("mc_theme");
      if (theme) document.documentElement.setAttribute("data-theme", theme);
    } catch (e) { /* ignore */ }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="scanlines" aria-hidden="true"></div>

<header class="masthead">
  <div class="masthead-inner">
    <div class="brand">
      <span class="brand-mark">&#9670;</span>
      <h1 class="brand-title">MODIFIER<span class="brand-title-accent">//</span>CONSOLE</h1>
    </div>
    <div class="masthead-actions">
      <div id="masthead-settings-group" class="masthead-settings-group">
        <label class="version-select-wrap">
          <span class="version-select-label">Version</span>
          <select id="version-select" class="version-select" aria-label="Data version"></select>
        </label>
        <label class="version-select-wrap">
          <span class="version-select-label">Theme</span>
          <select id="theme-select" class="version-select" aria-label="Color theme"></select>
        </label>
        <label class="version-select-wrap">
          <span class="version-select-label">Preview</span>
          <select id="og-format-select" class="version-select" aria-label="Permalink preview format">
            <option value="none">None</option>
            <option value="short">Short</option>
            <option value="long">Long</option>
          </select>
        </label>
        <label class="reader-checkbox-wrap">
          <input type="checkbox" id="reader-checkbox">
          Read Only
        </label>
      </div>
      <span id="settings-anchor" hidden></span>
      <button id="mobile-settings-btn" class="btn btn-ghost mobile-settings-btn" type="button">
        <span class="btn-icon">&#9881;</span> Settings
      </button>
      <button id="permalink-btn" class="btn btn-ghost" type="button">
        <span class="btn-icon">&#128279;</span> Copy Permalink
      </button>
      <button id="reset-btn" class="btn btn-ghost btn-danger" type="button">
        <span class="btn-icon">&#10005;</span> Reset
      </button>
    </div>
  </div>
</header>

<div id="reader-banner" class="reader-banner" hidden>
  <span class="reader-banner-label">Read-only view</span>
  <a id="reader-edit-link" class="btn btn-ghost btn-small" href="#">Open Editable Version</a>
</div>

<nav class="tabs" role="tablist" aria-label="Star tiers">
  <button class="tab active" data-tab="all" role="tab" aria-selected="true">All</button>
  <button class="tab" data-tab="1" role="tab" aria-selected="false">1 Stars</button>
  <button class="tab" data-tab="2" role="tab" aria-selected="false">2 Stars</button>
  <button class="tab" data-tab="3" role="tab" aria-selected="false">3 Stars</button>
  <button class="tab" data-tab="4" role="tab" aria-selected="false">4 Stars</button>
</nav>

<main class="layout">

  <section class="panel modifier-panel" aria-label="Modifier list">
    <div class="panel-head">
      <span class="panel-head-label" id="list-title">All Modifiers</span>
      <span class="panel-head-count" id="list-count">0 entries</span>
    </div>
    <div id="modifier-list" class="modifier-list">
      <!-- rows injected by app.js -->
    </div>
  </section>

  <aside class="panel summary-panel" aria-label="Selected modifiers summary">
    <div class="panel-head">
      <span class="panel-head-label">// Summary</span>
      <span class="panel-head-count" id="selected-count">0 selected</span>
    </div>

    <div id="summary-list" class="summary-list">
      <p class="empty-state">No modifiers queued. Select entries from the list to begin.</p>
    </div>

    <div class="boost-readout">
      <span class="boost-readout-label">Total Boost</span>
      <span class="boost-readout-value" id="total-boost">0%</span>
    </div>

    <div class="star-gauge" id="star-gauge" aria-label="Star rating gauge">
      <div class="star-gauge-head">
        <span id="star-band-label" class="star-band-label">0 STAR</span>
        <span id="star-next-label" class="star-next-label"></span>
      </div>
      <div class="star-gauge-track" id="star-gauge-track">
        <div class="star-gauge-fill" id="star-gauge-fill"></div>
        <div class="star-gauge-ticks" id="star-gauge-ticks"></div>
      </div>
      <div class="star-icons" id="star-icons"></div>
    </div>

    <div class="copy-list-row">
      <div class="pill-toggle" id="copy-list-format" role="group" aria-label="Copy list format">
        <button type="button" class="pill-btn active" data-format="short">Short</button>
        <button type="button" class="pill-btn" data-format="long">Long</button>
      </div>
      <button id="copy-list-btn" class="btn btn-ghost" type="button">
        <span class="btn-icon">&#128203;</span> Copy List
      </button>
    </div>
  </aside>

</main>

<section class="panel presets-panel" aria-label="Presets and configs">
  <div class="panel-head">
    <span class="panel-head-label">// Presets &amp; Configs</span>
    <div class="presets-panel-actions">
      <button id="save-preset-btn" class="btn btn-ghost btn-small" type="button">
        <span class="btn-icon">&#128190;</span> Save Current
      </button>
      <button id="export-config-btn" class="btn btn-ghost btn-small" type="button">
        <span class="btn-icon">&#128228;</span> Export Config
      </button>
      <button id="import-config-btn" class="btn btn-ghost btn-small" type="button">
        <span class="btn-icon">&#128229;</span> Import Config
      </button>
    </div>
  </div>
  <div id="presets-list" class="presets-list">
    <p class="empty-state">No presets for this version yet.</p>
  </div>
</section>

<div id="desc-popover" class="desc-popover" hidden>
  <div class="desc-popover-title" id="desc-popover-title"></div>
  <div class="desc-popover-label">Description</div>
  <div class="desc-popover-body" id="desc-popover-body"></div>
</div>

<div id="app-modal-backdrop" class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="app-modal-title">
    <div class="modal-head">
      <span class="modal-title" id="app-modal-title">Title</span>
      <button id="app-modal-close" class="modal-close" type="button" aria-label="Close">&#10005;</button>
    </div>
    <div class="modal-body" id="app-modal-body">
      <!-- populated by app.js per-mode -->
    </div>
    <div class="modal-actions" id="app-modal-actions">
      <!-- populated by app.js per-mode -->
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="js/app.js"></script>
</body>
</html>
